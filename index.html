<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=1920, height=1080, initial-scale=1.0"
    />
    <title>AhmedClock TV</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash">
      <div class="splash-content">
        <div class="splash-clock-icon">
          <svg viewBox="0 0 120 120" width="120" height="120">
            <circle
              cx="60"
              cy="60"
              r="56"
              fill="#fff"
              stroke="#b0976e"
              stroke-width="6"
            />
            <circle cx="60" cy="60" r="3" fill="#222" />
            <line
              x1="60"
              y1="60"
              x2="60"
              y2="28"
              stroke="#222"
              stroke-width="3.5"
              stroke-linecap="round"
            />
            <line
              x1="60"
              y1="60"
              x2="82"
              y2="60"
              stroke="#222"
              stroke-width="2.5"
              stroke-linecap="round"
            />
            <line
              x1="60"
              y1="60"
              x2="48"
              y2="78"
              stroke="#b22"
              stroke-width="1"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <div class="splash-title">AhmedClock TV</div>
        <div class="splash-subtitle">Ahmed Ayaan Zulqarnain</div>
        <div class="splash-loader">
          <div class="splash-loader-bar"></div>
        </div>
      </div>
    </div>

    <!-- Main Clock Screen -->
    <div id="main" class="hidden">
      <!-- Top bar -->
      <div class="top-bar">
        <div class="top-bar-left">
          <span class="top-bar-brand">Clock</span>
          <span class="top-bar-divider">|</span>
          <span class="top-bar-label">Developed by Ahmed Musa</span>
        </div>
        <div class="top-bar-right">
          <span class="top-bar-time" id="topBarTime">12:00 AM</span>
        </div>
      </div>

      <div class="main-layout">
        <!-- Clock area (centered, large) -->
        <div class="clock-area">
          <div class="clock-container">
            <div class="clock-shadow"></div>
            <div class="clock-body">
              <div class="clock-rim">
                <div class="clock-face">
                  <!-- Tick marks generated by JS -->
                  <div class="tick-marks" id="tickMarks"></div>

                  <!-- Hour numbers -->
                  <div class="hour-number hour-12">12</div>
                  <div class="hour-number hour-1">1</div>
                  <div class="hour-number hour-2">2</div>
                  <div class="hour-number hour-3">3</div>
                  <div class="hour-number hour-4">4</div>
                  <div class="hour-number hour-5">5</div>
                  <div class="hour-number hour-6">6</div>
                  <div class="hour-number hour-7">7</div>
                  <div class="hour-number hour-8">8</div>
                  <div class="hour-number hour-9">9</div>
                  <div class="hour-number hour-10">10</div>
                  <div class="hour-number hour-11">11</div>

                  <!-- Name text -->
                  <div class="clock-name">Ahmed Ayaan Zulqarnain</div>

                  <!-- Digital panel — positioned low, between 7 and 5 -->
                  <div class="digital-panel">
                    <div class="digital-date" id="digitalDate">MAR 29 SUN</div>
                    <div class="digital-temp" id="digitalTemp">32.8°C</div>
                  </div>

                  <!-- Clock hands -->
                  <div class="hand hour-hand" id="hourHand"></div>
                  <div class="hand minute-hand" id="minuteHand"></div>
                  <div class="hand second-hand" id="secondHand"></div>

                  <!-- Center cap -->
                  <div class="center-cap"></div>
                  <div class="center-pin"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- World clock panel (right side) -->
        <div class="world-clock-panel">
          <div class="world-clock-card" id="worldClockCard">
            <div class="world-clock-header">
              <span class="world-clock-icon">&#127760;</span>
              <span class="world-clock-title">World Clock</span>
            </div>
            <div class="world-clock-city" id="worldClockCity">Berlin</div>
            <div class="world-clock-time" id="worldClockTime">20:00</div>
            <div class="world-clock-offset" id="worldClockOffset">GMT+2</div>
            <div class="world-clock-date" id="worldClockDate">MAR 28 SAT</div>
            <button
              class="world-clock-change"
              id="worldClockChangeBtn"
              tabindex="0"
            >
              Change City
            </button>
          </div>

          <!-- City selector (hidden by default) -->
          <div class="city-selector hidden" id="citySelector">
            <div class="city-selector-title">Select City</div>
            <div class="city-list" id="cityList">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/clock.js"></script>
  </body>
</html>
